name: MIX2 HackiOS phone image
on:
  push:
    branches: ['codex/hackios-chiron']
    paths:
      - '.github/workflows/hackios-chiron-package.yml'
      - 'ci/hackios/package-chiron.py'
      - 'ci/hackios/phone_loader.py'
      - 'ci/hackios/apply_chiron_memory.py'
      - 'ci/hackios/memory_loader.inc'
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  image:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      GH_TOKEN: ${{ github.token }}
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Install loader and FAT tools
        run: |
          sudo apt-get update
          sudo apt-get install -y clang lld llvm mtools dosfstools
      - name: Test allocation admission and ownership transitions
        run: python3 -B -m unittest discover -s tests -p 'test_chiron_*.py' -v
      - name: Reuse the unchanged HK6b firmware and entry
        run: |
          gh run download 39951169904 --repo "$GITHUB_REPOSITORY" \
            --name chiron-memory-entry-39951169904 --dir dist/chiron-entry
          gh run download 39951169904 --repo "$GITHUB_REPOSITORY" \
            --name chiron-memory-firmware-39951169904 --dir dist/chiron-memory-firmware
          gh run download 39770335838 --repo "$GITHUB_REPOSITORY" \
            --name chiron-source-trace-39770335838-1 --dir dist/chiron-boot-template
          gh run download 39922183783 --repo "$GITHUB_REPOSITORY" \
            --name chiron-hackios-39922183783 --dir dist/chiron-runtime
      - name: Compile only the corrected small EFI loader
        run: |
          python3 ci/hackios/phone_loader.py --work "$RUNNER_TEMP/chiron-phone-loader" \
            --phone dist/chiron-runtime/phone
      - name: Package the unchanged firmware with the corrected loader
        run: |
          python3 ci/hackios/package-chiron.py \
            --template dist/chiron-boot-template/CT-39770335838-1-775f3f2e4009.img \
            --phone dist/chiron-runtime/phone \
            --entry dist/chiron-entry/ChironHackios.efi \
            --qualification dist/chiron-runtime/chiron-qualification.json \
            --firmware dist/chiron-memory-firmware/chiron-unixnu.fd \
            --memory-policy dist/chiron-memory-firmware/memory-policy.json \
            --output dist/chiron-hackios-image
          cp tools/start_chiron_hackios.py dist/chiron-hackios-image/
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: MIX2-HackiOS-HK6c
          path: |
            dist/chiron-hackios-image/
            dist/chiron-entry/
            dist/chiron-memory-firmware/memory-policy.json
          retention-days: 7
          compression-level: 1
