name: Chiron remote bring-up

on:
  push:
    branches: ['codex/**']
    paths:
      - '.github/workflows/**'
      - 'ci/**'
      - 'scripts/**'
      - 'drivers/**'
      - 'tests/**'
      - 'board.toml'
      - 'configs/**'
      - 'research/chiron-live-profile.json'
  workflow_dispatch:
    inputs:
      build_kernel:
        description: Compile the native 4K source kernel and driver archives
        type: boolean
        default: true
      kernel_mode:
        description: Source bootstrap or full RAM-init runtime with QEMU verification
        type: choice
        options: [bootstrap, ram-init]
        default: bootstrap
      build_firmware:
        description: Compile the UEFI manager, DarwinBoot and chiron firmware
        type: boolean
        default: true
      efi_run_id:
        description: Optional run with a verified chiron-efi artifact to reuse
        type: string
        default: ''

permissions:
  contents: read
  actions: read

concurrency:
  group: chiron-bringup-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-22.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - run: python3 -m unittest discover -s tests -v
      - run: python3 scripts/make-chiron-adt.py --output dist/board/chiron.adt
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: chiron-board-inputs
          path: |
            dist/board/
            board.toml
            configs/chiron_defconfig
          retention-days: 7

  efi:
    if: inputs.build_firmware && inputs.efi_run_id == ''
    needs: validate
    runs-on: ubuntu-22.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - name: Install cross tools on the remote runner
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential uuid-dev nasm clang lld llvm
      - run: bash ci/build-efi.sh
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: chiron-efi
          path: dist/efi/
          if-no-files-found: error
          retention-days: 7

  firmware:
    if: ${{ always() && inputs.build_firmware && needs.validate.result == 'success' && (needs.efi.result == 'success' || inputs.efi_run_id != '') }}
    needs: [validate, efi]
    runs-on: ubuntu-22.04
    timeout-minutes: 45
    env:
      CHIRON_EFI_RUN: ${{ inputs.efi_run_id || github.run_id }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: chiron-efi
          path: dist/efi
          github-token: ${{ github.token }}
          run-id: ${{ inputs.efi_run_id || github.run_id }}
      - name: Install original-platform cross tools
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential uuid-dev iasl nasm gcc-aarch64-linux-gnu abootimg python3-distutils python3-pil python3-git gettext libfreetype6-dev
      - run: bash ci/build-firmware.sh
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: chiron-firmware
          path: dist/firmware/
          retention-days: 7

  kernel:
    if: inputs.build_kernel
    needs: validate
    runs-on: macos-15
    timeout-minutes: 60
    env:
      DEVELOPER_DIR: /Applications/Xcode_16.4.app/Contents/Developer
      HOMEBREW_NO_AUTO_UPDATE: '1'
      CHIRON_KERNEL_MODE: ${{ inputs.kernel_mode || 'bootstrap' }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - name: Check runner tools
        run: |
          xcodebuild -version
          xcrun --sdk iphoneos --show-sdk-path
          command -v cmake
          command -v ninja
          command -v unifdef || brew install unifdef
          if [ "$CHIRON_KERNEL_MODE" = ram-init ]; then
            command -v qemu-system-aarch64 || brew install qemu
          fi
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        if: inputs.kernel_mode == 'ram-init'
        with:
          name: chiron-efi
          path: dist/efi
          github-token: ${{ github.token }}
          run-id: ${{ inputs.efi_run_id }}
      - run: bash ci/build-kernel.sh
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: chiron-kernel-source
          path: dist/kernel/
          retention-days: 7
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always() && inputs.kernel_mode == 'ram-init'
        with:
          name: chiron-ram-init
          path: dist/ram-init/
          retention-days: 7
